 ck:d=>{const i=CUR.chk[d.n];i.done=!i.done;i.date=i.done?nowS():null;ckr()},rmk:d=>{CUR.chk.splice(d.n,1);ckr()},
 cpdf:()=>{const{t,e}=cardInfo(),c=CUR.chk,li=(a,col)=>a.map(i=>`<li style="color:${col}">${esc(i.texto)} ${i.date?`<small>(${i.date})</small>`:''}</li>`).join('')||'<li>—</li>';
  pdf('Implantação '+t,e,`<div class="m"><b>Contato:</b> ${esc($('#c').value)||'—'}<br><b>Progresso:</b> ${pct(c)}%</div><h3>Anotações</h3>${DOMPurify.sanitize($('#o').innerHTML)||'—'}<h3>Etapas concluídas</h3><ul>${li(c.filter(i=>i.done),'#15803d')}</ul><h3>Etapas pendentes</h3><ul>${li(c.filter(i=>!i.done),'#b91c1c')}</ul>`,CUR.col.name)},
 cia:()=>{const{t,e}=cardInfo(),c=CUR.chk;run(`Você é um analista da WeON. Crie um Status Report executivo curto e formal para o projeto "${t}" (Empresa: ${e}). Progresso: ${pct(c)}% (${c.filter(i=>i.done).length}/${c.length}). Próximas pendências: ${JSON.stringify(c.filter(i=>!i.done).slice(0,4).map(i=>i.texto))}. Anotações: "${$('#o').innerText.slice(0,300)}". Use 3 seções: "Resumo Executivo", "O que foi concluído" e "Próximas Etapas". Responda em português.`)},
 cxp:()=>{const{t,e}=cardInfo();pdf('Implantação '+t,e,md($('#ao').textContent),CUR.col.name)},
 rep:d=>{const rows=S.cols.flatMap(c=>c.cards.map(k=>({...k,col:c.name})));
  dlg('Status report geral',`<div class="bar"><span><button class="btn" data-a="bpdf">PDF geral</button><button class="btn" data-a="bia"><i class="fa-solid fa-robot"></i> Resumo IA</button><button class="btn" id="xp" data-a="bxp" hidden>PDF do resumo IA</button></span></div><pre id="ao" hidden style="white-space:pre-wrap"></pre><p class="mu">${rows.length} projeto(s) ativos no quadro.</p>`);if(d.ia)A.bia()},
 bpdf:()=>{const rows=S.cols.flatMap(c=>c.cards.map(k=>({...k,col:c.name}))),s=stats();
  pdf('Status Report Geral','Carteira de implantações',`<div class="m">Total: <b>${s.t}</b> · Em andamento: <b>${s.a}</b> · Bloqueio: <b>${s.b}</b> · Concluídos: <b>${s.c}</b></div><table><tr><th>Projeto</th><th>Etapa</th><th>Progresso</th><th>Marcos</th><th>Pendências</th></tr>${rows.map(k=>`<tr><td><b>${esc(k.title)}</b><br>${esc(k.empresa)}</td><td>${esc(k.col)}</td><td>${pct(k.chk)}%<div class="b"><i style="width:${pct(k.chk)}%"></i></div></td><td>${ms(k.chk)}</td><td>${esc(k.chk.filter(i=>!i.done).slice(0,2).map(i=>i.texto).join(', '))}</td></tr>`).join('')}</table>`,'CARTEIRA GERAL')},
 bia:()=>{const r=S.cols.flatMap(c=>c.cards.map(k=>({cliente:k.title,etapa:c.name,progresso:pct(k.chk)+'%',pendencias:k.chk.filter(i=>!i.done).length})));if(!r.length)return toast('Quadro vazio');
  run(`Você é Gestor da WeON. Faça um diagnóstico executivo resumido dos projetos ativos: ${JSON.stringify(r)}. Divida em "Resumo Geral da Carteira", "Gargalos" e "Ações Recomendadas". Responda em português.`)},
 bxp:()=>pdf('Diagnóstico geral da carteira','Relatório executivo consolidado',md($('#ao').textContent),'CARTEIRA GERAL')
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName=='INPUT'&&e.type!='click')return;if(b.dataset.a=='card'&&e.target.closest('button'))return;A[b.dataset.a]?.(b.dataset,b)});
document.addEventListener('mousedown',e=>{if(e.target.closest('[data-c]'))e.preventDefault()});
$('#q').oninput=e=>{S.q=e.target.value.trim();render();$('#q').focus()};
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.sections||!o.cols)throw 0;if(confirm('Substituir os dados atuais pelo backup?')){o.ai={...o.ai,key:S.ai.key};S=o;save();render();toast('Backup importado')}}catch{toast('Arquivo inválido')}})};
try{const s=JSON.parse(localStorage.weon_sess);if(s.x>Date.now())start(s.e)}catch{}
</script>
</body>
</html>
